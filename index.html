<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TradeMyWay · Virality Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#0D1727;--navy2:#172A40;--orange:#FF7417;--text:#172033;--bg:#F7F9FC;--muted:#7C8BA1;--border:#E3E9F1}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text)}
header{background:var(--navy);color:#fff;padding:16px 20px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
header img{height:34px}header .tag{color:var(--orange);font-weight:600;font-size:14px}
select{font:inherit;padding:8px 10px;border-radius:8px;border:1px solid var(--navy2);background:var(--navy2);color:#fff}
main{max-width:1100px;margin:0 auto;padding:20px}
h2{font-size:18px;font-weight:800;margin:28px 0 12px;border-left:4px solid var(--orange);padding-left:10px}
.summary{background:#fff;border:1px solid var(--border);border-radius:12px;padding:14px 16px;color:var(--text)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.card{background:#fff;border:1px solid var(--border);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.card a{color:var(--navy);font-weight:600;text-decoration:none}.card a:hover{color:var(--orange)}
.rank{background:var(--orange);color:#fff;border-radius:6px;padding:1px 8px;font-weight:800;font-size:13px;margin-right:6px}
.metrics{display:flex;flex-wrap:wrap;gap:6px;font-size:13px}.metrics span{background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:2px 8px}
.fmt,.muted{color:var(--muted);font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{background:var(--navy);color:#fff;border-radius:999px;padding:6px 12px;font-size:14px}
ul.formats{background:#fff;border:1px solid var(--border);border-radius:12px;padding:14px 14px 14px 32px;margin:0}ul.formats li{margin:6px 0}
.idea{border-top:4px solid var(--orange)}.idea h3{margin:0;font-size:17px}.hook{font-weight:800;color:var(--orange)}
footer{text-align:center;color:var(--muted);font-size:13px;padding:30px 10px}
</style>
</head>
<body>
<header>
  <div><img src="logo.png" alt="TradeMyWay"><div class="tag">Less admin. More trade. · Virality Board</div></div>
  <label>Day <select id="day"></select></label>
</header>
<main id="app"><p class="muted">Loading…</p></main>
<footer>Real posts and metrics from public X reads only. Views = impressions; video views shown separately.</footer>
<script>
const fmt=n=>n==null?'–':Number(n).toLocaleString('en-GB');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let days=[];
function render(d){
  const hits=[...d.hits].sort((a,b)=>(b.views||0)-(a.views||0));
  document.getElementById('app').innerHTML=`
  ${d.summary?`<div class="summary"><b>${esc(d.date)}</b>${d.window?` <span class="muted">(${esc(d.window)})</span>`:''}<br>${esc(d.summary)}</div>`:''}
  <h2>Top posts</h2><div class="grid">${hits.map((h,i)=>`
    <div class="card"><div><span class="rank">#${i+1}</span><a href="${esc(h.url)}" target="_blank" rel="noopener">@${esc(h.handle)}</a></div>
    <div>${esc(h.text)}</div>
    <div class="metrics"><span>👁 ${fmt(h.views)}</span>${h.video_views!=null?`<span>▶ ${fmt(h.video_views)}</span>`:''}<span>❤ ${fmt(h.likes)}</span><span>🔁 ${fmt(h.reposts)}</span>${h.replies!=null?`<span>💬 ${fmt(h.replies)}</span>`:''}</div>
    <div class="fmt">${esc(h.format)}${h.posted?` · ${esc(h.posted)}`:''}</div></div>`).join('')}</div>
  <h2>Keywords</h2><div class="chips">${(d.keywords||[]).map(k=>`<span class="chip">${esc(k)}</span>`).join('')}</div>
  <h2>Formats that worked</h2><ul class="formats">${(d.formats||[]).map(f=>`<li>${esc(f)}</li>`).join('')}</ul>
  <h2>3 Reel ideas</h2><div class="grid">${(d.ideas||[]).map((x,i)=>typeof x==='string'?`<div class="card idea">${esc(x)}</div>`:`
    <div class="card idea"><h3>${i+1}. ${esc(x.title)}</h3><div class="hook">${esc(x.hook)}</div>
    <div><b>Why:</b> ${esc(x.why)}</div><div><b>Build:</b> ${esc(x.build)}</div>
    ${x.assets?`<div class="muted">Assets: ${x.assets.map(esc).join(', ')}</div>`:''}</div>`).join('')}</div>`;
}
fetch('data.json',{cache:'no-store'}).then(r=>r.json()).then(j=>{
  days=j.sort((a,b)=>b.date.localeCompare(a.date));
  const sel=document.getElementById('day');
  sel.innerHTML=days.map((d,i)=>`<option value="${i}">${d.date}</option>`).join('');
  sel.onchange=()=>render(days[sel.value]);
  render(days[0]);
}).catch(e=>{document.getElementById('app').innerHTML='<p>Could not load data.json</p>'});
</script>
</body>
</html>
